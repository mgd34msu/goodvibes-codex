name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Node ${{ matrix.node }} / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check version alignment
        run: npm run check:versions

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build plugin bundles
        run: npm run build

      - name: Require current generated bundles
        run: git diff --exit-code -- plugins/goodvibes/server plugins/goodvibes/ARTIFACTS.json

      - name: Validate plugin tree
        run: npm run validate:plugin

      - name: Smoke-test all MCP servers
        run: npm run smoke:mcp

  platform-smoke:
    name: MCP smoke / Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build plugin bundles
        run: npm run build

      - name: Validate plugin tree
        run: npm run validate:plugin

      - name: Smoke-test all MCP servers
        run: npm run smoke:mcp

  candidate-artifact:
    name: Candidate marketplace artifact
    needs: [quality, platform-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild and validate candidate
        run: |
          npm run build
          git diff --exit-code -- plugins/goodvibes/server plugins/goodvibes/ARTIFACTS.json
          npm run validate:plugin
          npm run smoke:mcp

      - name: Stage tracked marketplace files
        shell: bash
        run: |
          mkdir -p dist/stage
          git archive --format=tar HEAD .agents/plugins/marketplace.json plugins/goodvibes | tar -xf - -C dist/stage
          find dist/stage -type f -printf '%P\n' | LC_ALL=C sort > dist/stage/FILELIST
          (
            cd dist/stage
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          VERSION=$(node -p "require('./plugins/goodvibes/.codex-plugin/plugin.json').version")
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "dist/goodvibes-codex-${VERSION}.tar.gz" -C dist/stage .
          sha256sum "dist/goodvibes-codex-${VERSION}.tar.gz" > "dist/goodvibes-codex-${VERSION}.tar.gz.sha256"

      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: goodvibes-plugin-${{ github.sha }}
          path: |
            dist/goodvibes-codex-*.tar.gz
            dist/goodvibes-codex-*.tar.gz.sha256
            dist/stage/FILELIST
            dist/stage/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
